<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoría 5S — ahora en AlmafrutApp</title>
<style>
  body { margin: 0; font-family: Segoe UI, Arial, sans-serif; background: #154f5a; color: #fff; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { font-size: 1.4rem; }
  a { display: inline-block; margin-top: 16px; background: #efa21e; color: #154f5a; font-weight: 700; padding: 12px 20px; border-radius: 8px; text-decoration: none; }
</style>
<script>
  // El formulario 5S se ha pasado a AlmafrutApp (01/10/2026). Los enlaces antiguos llevan a la misma auditoría en la app.
  (function () {
    var p = new URLSearchParams(location.search);
    var zona = p.get('zona'), trimestre = p.get('trimestre');
    var destino = 'https://app.almafrut.net/5s';
    if (zona && trimestre) destino += '/ir?zona=' + encodeURIComponent(zona) + '&trimestre=' + encodeURIComponent(trimestre);
    location.replace(destino);
  })();
</script>
</head>
<body>
<main>
  <h1>La auditoría 5S ahora está en AlmafrutApp</h1>
  <p>Entra con tu cuenta de Microsoft de Almafrut.</p>
  <a href="https://app.almafrut.net/5s">Ir a AlmafrutApp</a>
</main>
</body>
</html>
